# cargo-deny policy for esp-smarthome-poc.

[graph]
all-features = true

[output]
feature-depth = 1

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked = "deny"
unmaintained = "all"
ignore = [
  # Unmaintained, pulled in by the esp-hal dependency tree. No upstream fix.
  { id = "RUSTSEC-2024-0436", reason = "paste is unmaintained; used by the ESP crates" },
  { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml is unmaintained; used by esp-config through serde_yaml" },
]

[licenses]
unused-allowed-license = "allow"
allow = [
  "Apache-2.0",
  "BSD-1-Clause",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8
exceptions = []

[licenses.private]
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
