<svg xmlns="http://www.w3.org/2000/svg" width="960" height="565" viewBox="0 0 960 565"
     role="img" aria-labelledby="title desc">
  <title id="title">Voice-controlled lamp wiring</title>
  <desc id="desc">The ESP32-S3 supplies 3.3 V to the INMP441 and 5 V to the MAX98357A.
    Both share ground, bit clock GPIO4 and word select GPIO5. Mic L/R is grounded.
    GPIO6 receives mic data and GPIO7 sends speaker data. GPIO8 drives the red lamp
    and GPIO11 drives the green listening LED, each through its own 330-ohm resistor
    to common ground. The speaker connects across the amplifier outputs.</desc>
  <style>
    text { font-family: sans-serif; font-size: 16px; fill: #192d3d; }
    .part { font-size: 22px; font-weight: bold; }
    .note { font-size: 14px; fill: #405769; }
    .center { text-anchor: middle; }
    .right { text-anchor: end; }
    .box { fill: white; stroke: #465d6e; stroke-width: 2; }
    .wire { fill: none; stroke-width: 3; stroke-linejoin: round; }
    .supply { stroke: #b44422; }
    .ground { stroke: #394653; }
    .clock { stroke: #196a88; }
    .data { stroke: #315d3a; }
    .lamp { stroke: #885728; }
  </style>
  <rect width="960" height="565" fill="#fafbfd"/>

  <!-- Board and breakout edges terminate the wires at their labelled pins. -->
  <rect class="box" x="24" y="24" width="205" height="300" rx="10"/>
  <rect class="box" x="331" y="24" width="298" height="390" rx="10"/>
  <rect class="box" x="731" y="24" width="205" height="343" rx="10"/>
  <g class="center">
    <text class="part" x="126" y="59">INMP441</text>
    <text class="note" x="126" y="82">I²S microphone</text>
    <text class="part" x="480" y="59">ESP32-S3-DevKitC-1</text>
    <text class="note" x="480" y="82">N32R16V · USB powered</text>
    <text class="part" x="833" y="59">MAX98357A</text>
    <text class="note" x="833" y="82">Mono I²S amplifier</text>
  </g>

  <g class="wire">
    <path class="supply" d="M229 118 H331 M629 118 H731"/>
    <path class="ground" d="M229 157 H331 M229 185 H269 V157 M629 157 H731"/>
    <path class="clock" d="M229 214 H331 M629 214 H731 M229 251 H331 M629 251 H731"/>
    <path class="data" d="M229 294 H331 M629 294 H731"/>
  </g>
  <circle cx="269" cy="157" r="4.5" fill="#394653"/>
  <g class="right">
    <text x="216" y="123">VDD</text><text x="216" y="162">GND</text>
    <text x="216" y="190">L/R</text><text x="216" y="219">SCK</text>
    <text x="216" y="256">WS</text><text x="216" y="299">SD (out)</text>
  </g>
  <g>
    <text x="744" y="123">VIN</text><text x="744" y="162">GND</text>
    <text x="744" y="219">BCLK</text><text x="744" y="256">LRC</text>
    <text x="744" y="299">DIN</text>
    <text x="344" y="123">3V3</text><text class="right" x="616" y="123">5V</text>
    <text x="344" y="162">GND</text><text class="right" x="616" y="162">GND</text>
    <text x="344" y="299">GPIO6 · RX</text>
    <text class="right" x="616" y="299">GPIO7 · TX</text>
  </g>
  <g class="center">
    <text x="480" y="219">GPIO4 · shared bit clock</text>
    <text x="480" y="256">GPIO5 · shared word select</text>
    <text x="370" y="399">GPIO8</text><text x="480" y="399">GPIO11</text>
    <text x="597" y="399">GND</text>
    <text x="787" y="352">OUT+</text><text x="879" y="352">OUT−</text>
  </g>

  <!-- Each LED has its own resistor. Only their cathodes share a net. -->
  <g fill="white" stroke="#885728" stroke-width="2">
    <path class="wire lamp" d="M370 414 V433 M370 466 V488 M480 414 V433 M480 466 V488"/>
    <rect x="363" y="433" width="14" height="33"/>
    <rect x="473" y="433" width="14" height="33"/>
  </g>
  <text class="right" x="350" y="455">330 Ω</text><text x="500" y="455">330 Ω</text>
  <g fill="#b84c43" stroke="#933b35" stroke-width="2">
    <path d="M360 488 H380 L370 507 Z M358 509 H382"/>
    <path d="M378 500 l9 8 m-5 -1 l5 1 -1 -5 M381 493 l9 8 m-5 -1 l5 1 -1 -5" fill="none"/>
  </g>
  <g fill="#478555" stroke="#315d3a" stroke-width="2">
    <path d="M470 488 H490 L480 507 Z M468 509 H492"/>
    <path d="M488 500 l9 8 m-5 -1 l5 1 -1 -5 M491 493 l9 8 m-5 -1 l5 1 -1 -5" fill="none"/>
  </g>
  <path class="wire ground" d="M370 509 V540 H597 V414 M480 509 V540"/>
  <circle cx="480" cy="540" r="4.5" fill="#394653"/>
  <text class="right" x="345" y="501">Red lamp</text>
  <text x="507" y="495">Green LED</text>
  <text class="note" x="507" y="514">Listening</text>
  <path class="wire data" d="M787 367 V420 M879 367 V420"/>
  <rect class="box" x="749" y="420" width="168" height="60" rx="8"/>
  <g class="center">
    <text x="787" y="439">+</text><text x="879" y="439">−</text>
    <text x="833" y="463">8 Ω speaker</text>
  </g>
</svg>
